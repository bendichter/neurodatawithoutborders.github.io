baseURL: https://nwb.org/
languageCode: en
title: Neurodata Without Borders

# Build Settings
buildFuture: true
enableRobotsTXT: true

# Pagination
pagination:
  pagerSize: 10

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: false
    noClasses: false

# Output formats: /llms.txt is a plain-text guide for AI assistants
# (https://llmstxt.org), rendered from layouts/index.llms.txt.
outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
    rel: alternate

outputs:
  home: [html, rss, llms]

# Modules
module:
  mounts:
    - source: assets
      target: assets
    # Also expose static images as assets so templates can resize them
    # (see layouts/partials/essentials/img.html). They are still copied to
    # the site as-is through the default static mount.
    - source: static/images
      target: assets/images
