# Newsletter (Mailchimp audience "Neurodata Without Borders").
# form_action + honeypot come from Mailchimp's classic embedded form
# (Audience > Signup forms > Embedded forms). Clear form_action to fall back
# to a button linking to signup_url.
newsletter:
  signup_url: "https://mailchi.mp/fe2a9bc55a1a/nwb-signup"
  form_action: "https://gmail.us3.list-manage.com/subscribe/post?u=eacaccc485a4e5f36034bbdbd&id=a9718ab27f"
  honeypot: "b_eacaccc485a4e5f36034bbdbd_a9718ab27f"
  button_text: "Subscribe"

